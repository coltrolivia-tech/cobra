<!DOCTYPE html>
<!-- 
    JOGO DA COBRINHA (Snake Game)
    ==============================
    Este arquivo contém tudo que o jogo precisa: HTML (estrutura), 
    CSS (estilo/aparência) e JavaScript (lógica do jogo), tudo em um único arquivo.
    Os comentários explicam cada parte para te ajudar a aprender!
-->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Cobrinha</title>
    <style>
        /* ===== ESTILOS (CSS) =====
           CSS é responsável pela aparência visual da página */

        /* Reset básico: remove margens e espaçamentos padrão do navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* faz o tamanho do elemento incluir borda e padding */
        }

        body {
            /* Centraliza todo o conteúdo da página, tanto na vertical quanto na horizontal */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* ocupa a altura total da tela */
            background: #1e1e2f; /* cor de fundo escura */
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        h1 {
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* Painel que mostra a pontuação */
        #placar {
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* O elemento <canvas> é onde vamos DESENHAR o jogo usando JavaScript */
        canvas {
            background: #0f0f1a;
            border: 4px solid #4caf50; /* borda verde ao redor do tabuleiro */
            border-radius: 8px;
        }

        #mensagem {
            margin-top: 15px;
            font-size: 18px;
            min-height: 24px; /* reserva espaço para não "pular" o layout quando o texto aparecer */
            color: #ff5252;
            font-weight: bold;
        }

        #instrucoes {
            margin-top: 10px;
            font-size: 14px;
            color: #aaaaaa;
            text-align: center;
        }

        button {
            margin-top: 12px;
            padding: 8px 20px;
            font-size: 16px;
            background: #4caf50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <h1>🐍 Jogo da Cobrinha</h1>
    <div id="placar">Pontos: 0 | Recorde: 0</div>

    <!-- O canvas é a "tela" onde o jogo será desenhado -->
    <canvas id="tabuleiro" width="400" height="400"></canvas>

    <div id="mensagem"></div>
    <button id="botaoReiniciar">Reiniciar Jogo</button>
    <div id="instrucoes">
        Use as setas do teclado (↑ ↓ ← →) ou W A S D para mover a cobrinha.<br>
        Coma os pontos vermelhos para crescer. Não bata nas paredes nem em você mesmo!
    </div>

    <script>
        /* ===== LÓGICA DO JOGO (JavaScript) =====
           Aqui é onde tudo acontece: desenhar a cobrinha, mover ela,
           detectar colisões, gerar comida, etc. */

        // Pega a referência do elemento <canvas> do HTML e o seu "contexto de desenho" 2D
        // O "contexto" é o objeto que nos dá os comandos para desenhar (retângulos, cores, etc)
        const canvas = document.getElementById("tabuleiro");
        const ctx = canvas.getContext("2d");

        // Pega referências de outros elementos do HTML que vamos atualizar via JS
        const placarElemento = document.getElementById("placar");
        const mensagemElemento = document.getElementById("mensagem");
        const botaoReiniciar = document.getElementById("botaoReiniciar");

        // ===== CONFIGURAÇÕES DO JOGO =====
        const TAMANHO_CELULA = 20;        // tamanho (em pixels) de cada "quadradinho" do tabuleiro
        const COLUNAS = canvas.width / TAMANHO_CELULA;   // quantidade de colunas no tabuleiro (400/20 = 20)
        const LINHAS = canvas.height / TAMANHO_CELULA;   // quantidade de linhas no tabuleiro (400/20 = 20)
        const VELOCIDADE_INICIAL = 150;   // tempo (ms) entre cada "passo" da cobrinha. Menor = mais rápido.

        // ===== VARIÁVEIS DE ESTADO DO JOGO =====
        // Essas variáveis guardam a "situação atual" do jogo e mudam com o tempo

        let cobrinha;          // array de objetos {x, y} representando cada segmento do corpo da cobrinha
        let direcao;           // direção atual do movimento: "cima", "baixo", "esquerda" ou "direita"
        let proximaDirecao;    // guarda a próxima direção escolhida pelo jogador (evita bugs de virar 2x no mesmo frame)
        let comida;            // posição {x, y} da comida atual
        let pontos;            // pontuação atual
        let recorde = 0;       // melhor pontuação já alcançada nesta sessão
        let velocidadeAtual;   // velocidade atual do jogo (diminui conforme o jogador ganha pontos, ficando mais difícil)
        let jogoRodando;       // booleano: true se o jogo está em andamento, false se acabou
        let idIntervalo;       // guarda a referência do "setInterval" para podermos pará-lo depois

        // ===== FUNÇÃO: iniciarJogo =====
        // Prepara (ou reinicia) todas as variáveis para começar uma nova partida
        function iniciarJogo() {
            // A cobrinha começa com 3 segmentos, no meio do tabuleiro
            cobrinha = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direcao = "direita";        // a cobrinha começa andando para a direita
            proximaDirecao = "direita";
            pontos = 0;
            velocidadeAtual = VELOCIDADE_INICIAL;
            jogoRodando = true;
            mensagemElemento.textContent = "";

            gerarComida(); // sorteia a primeira posição da comida
            atualizarPlacar();

            // Se já existia um intervalo rodando (de uma partida anterior), cancela ele
            // para não termos dois "loops" do jogo rodando ao mesmo tempo
            if (idIntervalo) clearInterval(idIntervalo);

            // setInterval chama a função "passoDoJogo" repetidamente, a cada X milissegundos
            idIntervalo = setInterval(passoDoJogo, velocidadeAtual);
        }

        // ===== FUNÇÃO: gerarComida =====
        // Escolhe uma posição aleatória no tabuleiro para a comida aparecer
        function gerarComida() {
            let novaComida;
            let posicaoValida = false;

            // Repete o sorteio até encontrar uma posição que NÃO esteja em cima da cobrinha
            while (!posicaoValida) {
                novaComida = {
                    x: Math.floor(Math.random() * COLUNAS), // número aleatório entre 0 e COLUNAS-1
                    y: Math.floor(Math.random() * LINHAS)
                };

                // Verifica se essa posição colide com algum segmento da cobrinha
                posicaoValida = !cobrinha.some(
                    segmento => segmento.x === novaComida.x && segmento.y === novaComida.y
                );
            }

            comida = novaComida;
        }

        // ===== FUNÇÃO: passoDoJogo =====
        // Essa é a função principal, chamada repetidamente pelo setInterval.
        // A cada chamada, ela: move a cobrinha, checa colisões, checa se comeu, e redesenha a tela.
        function passoDoJogo() {
            direcao = proximaDirecao; // aplica a direção escolhida pelo jogador desde o último passo

            // Calcula a nova posição da "cabeça" da cobrinha, baseada na direção atual
            const cabecaAtual = cobrinha[0];
            let novaCabeca = { x: cabecaAtual.x, y: cabecaAtual.y };

            if (direcao === "cima") novaCabeca.y -= 1;
            if (direcao === "baixo") novaCabeca.y += 1;
            if (direcao === "esquerda") novaCabeca.x -= 1;
            if (direcao === "direita") novaCabeca.x += 1;

            // ===== VERIFICAÇÃO DE COLISÃO COM AS PAREDES =====
            if (
                novaCabeca.x < 0 || novaCabeca.x >= COLUNAS ||
                novaCabeca.y < 0 || novaCabeca.y >= LINHAS
            ) {
                fimDeJogo();
                return; // encerra a função aqui, não continua o resto do código
            }

            // ===== VERIFICAÇÃO DE COLISÃO COM O PRÓPRIO CORPO =====
            const bateuNoProprioCorpo = cobrinha.some(
                segmento => segmento.x === novaCabeca.x && segmento.y === novaCabeca.y
            );
            if (bateuNoProprioCorpo) {
                fimDeJogo();
                return;
            }

            // Adiciona a nova cabeça no início do array (a cobrinha "avança")
            cobrinha.unshift(novaCabeca);

            // ===== VERIFICA SE A COBRINHA COMEU A COMIDA =====
            const comeuComida = novaCabeca.x === comida.x && novaCabeca.y === comida.y;

            if (comeuComida) {
                pontos += 10;
                atualizarPlacar();
                gerarComida();

                // A cada 50 pontos, aumenta um pouco a velocidade do jogo (deixa mais difícil)
                if (pontos % 50 === 0 && velocidadeAtual > 60) {
                    velocidadeAtual -= 10;
                    clearInterval(idIntervalo);
                    idIntervalo = setInterval(passoDoJogo, velocidadeAtual);
                }
            } else {
                // Se NÃO comeu, remove o último segmento da cauda,
                // criando a ilusão de movimento (a cobrinha "anda" em vez de só crescer)
                cobrinha.pop();
            }

            desenharTudo(); // redesenha o tabuleiro com a nova posição da cobrinha
        }

        // ===== FUNÇÃO: desenharTudo =====
        // Responsável por limpar e redesenhar todo o conteúdo do canvas a cada passo
        function desenharTudo() {
            // Limpa o canvas inteiro antes de redesenhar (senão os desenhos antigos ficariam sobrepostos)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- Desenha a comida (um quadrado vermelho) ---
            ctx.fillStyle = "#ff5252";
            ctx.fillRect(
                comida.x * TAMANHO_CELULA,
                comida.y * TAMANHO_CELULA,
                TAMANHO_CELULA,
                TAMANHO_CELULA
            );

            // --- Desenha cada segmento da cobrinha ---
            cobrinha.forEach((segmento, indice) => {
                // A cabeça (índice 0) fica em um verde mais claro, o resto do corpo em verde mais escuro
                ctx.fillStyle = indice === 0 ? "#8bc34a" : "#4caf50";

                ctx.fillRect(
                    segmento.x * TAMANHO_CELULA,
                    segmento.y * TAMANHO_CELULA,
                    TAMANHO_CELULA,
                    TAMANHO_CELULA
                );

                // Desenha uma borda escura em volta de cada segmento, para diferenciar os quadrados
                ctx.strokeStyle = "#0f0f1a";
                ctx.strokeRect(
                    segmento.x * TAMANHO_CELULA,
                    segmento.y * TAMANHO_CELULA,
                    TAMANHO_CELULA,
                    TAMANHO_CELULA
                );
            });
        }

        // ===== FUNÇÃO: atualizarPlacar =====
        // Atualiza o texto do placar na tela com os pontos e o recorde atuais
        function atualizarPlacar() {
            if (pontos > recorde) {
                recorde = pontos;
            }
            placarElemento.textContent = `Pontos: ${pontos} | Recorde: ${recorde}`;
        }

        // ===== FUNÇÃO: fimDeJogo =====
        // Chamada quando a cobrinha bate na parede ou nela mesma
        function fimDeJogo() {
            jogoRodando = false;
            clearInterval(idIntervalo); // para o loop do jogo
            mensagemElemento.textContent = "Fim de jogo! Clique em 'Reiniciar Jogo' para tentar de novo.";
        }

        // ===== CAPTURA DE TECLADO =====
        // "escuta" o evento de tecla pressionada em todo o documento
        document.addEventListener("keydown", (evento) => {
            if (!jogoRodando) return; // ignora teclas se o jogo já acabou

            const tecla = evento.key;

            // Setas do teclado ou WASD, com verificação para impedir que a cobrinha
            // vire 180 graus instantaneamente (o que causaria uma colisão consigo mesma)
            if ((tecla === "ArrowUp" || tecla === "w" || tecla === "W") && direcao !== "baixo") {
                proximaDirecao = "cima";
            } else if ((tecla === "ArrowDown" || tecla === "s" || tecla === "S") && direcao !== "cima") {
                proximaDirecao = "baixo";
            } else if ((tecla === "ArrowLeft" || tecla === "a" || tecla === "A") && direcao !== "direita") {
                proximaDirecao = "esquerda";
            } else if ((tecla === "ArrowRight" || tecla === "d" || tecla === "D") && direcao !== "esquerda") {
                proximaDirecao = "direita";
            }
        });

        // ===== BOTÃO DE REINICIAR =====
        // Quando o botão é clicado, chama a função que reinicia todas as variáveis do jogo
        botaoReiniciar.addEventListener("click", iniciarJogo);

        // ===== INÍCIO =====
        // Assim que a página carrega, o jogo começa automaticamente
        iniciarJogo();
    </script>
</body>
</html>
